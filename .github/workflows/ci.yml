name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-quality:
    name: .NET build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CarlensAI.sln

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build with warnings as errors
        run: >
          dotnet build CarlensAI.sln
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run unit tests
        run: >
          dotnet test test/Carlens.Tests/Carlens.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit

      - name: Enforce architecture boundaries
        run: >
          dotnet test test/Carlens.ArchitectureTests/Carlens.ArchitectureTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=architecture-tests.trx"
          --results-directory artifacts/test-results/architecture

      - name: Detect missing EF Core migrations
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Carlens.Infrastructure/Carlens.Infrastructure.csproj
          --startup-project src/Carlens.Api/Carlens.Api.csproj
          --configuration Release
          --no-build
          --
          --environment Development

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Testcontainers integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: >
          dotnet restore
          test/Carlens.IntegrationTests/Carlens.IntegrationTests.csproj

      - name: Build with warnings as errors
        run: >
          dotnet build
          test/Carlens.IntegrationTests/Carlens.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --warnaserror

      - name: Run PostgreSQL, Redis and RabbitMQ integration tests
        run: >
          dotnet test
          test/Carlens.IntegrationTests/Carlens.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: artifacts/test-results/integration/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: React build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Carlens.Web/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/Carlens.Web/ClientApp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
