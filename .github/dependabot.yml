version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/*"
      - "/test/*"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/src/Carlens.Web/ClientApp"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - "/"
      - "/src/Carlens.Api"
      - "/src/Carlens.AiWorker"
      - "/src/Carlens.Web"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
